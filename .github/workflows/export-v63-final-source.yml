name: Export exact 6.3 final source

on:
  push:
    branches: ["tooling/export-v63-final-source"]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          zip -qr Sarah-Maria-Family-Adventure-6.3-Exact-Source.zip . \
            -x '.git/*' '.github/workflows/export-v63-final-source.yml'
      - uses: actions/upload-artifact@v4
        with:
          name: mermaid-v63-final-exact-source
          path: Sarah-Maria-Family-Adventure-6.3-Exact-Source.zip
          compression-level: 0
