name: Import Mermaid 5.0 Source

on:
  push:
    paths:
      - "Sarah-Maria-Family-Adventure-5.0-Source (2).zip"
      - ".github/workflows/import-source.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="Sarah-Maria-Family-Adventure-5.0-Source (2).zip"
          source_dir=".unpack/Sarah-Maria-5.0-Source"

          test -f "$archive"
          rm -rf .unpack
          mkdir -p .unpack
          unzip -q "$archive" -d .unpack
          test -f "$source_dir/dist/index.html"
          test -f "$source_dir/VERSION"

          shopt -s dotglob nullglob
          for item in "$source_dir"/*; do
            base="$(basename "$item")"
            rm -rf "./$base"
            cp -a "$item" "./$base"
          done

          rm -rf .unpack "$archive"

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find dist tests -type f \( -name '*.js' -o -name '*.cjs' \) -print0)

      - name: Verify release structure
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "5.0.0"
          test -f dist/index.html
          test -f dist/game.js
          test -f dist/style.css
          test -d dist/assets
          test -d tests

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Import Sarah Maria Family Adventure 5.0 source"
          git push
