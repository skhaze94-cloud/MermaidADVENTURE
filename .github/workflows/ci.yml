name: Mermaid Adventure CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find dist tests -type f \( -name '*.js' -o -name '*.cjs' \) -print0)
      - name: Focused regressions
        run: |
          node tests/treasure-ui-v8.cjs
          node tests/world-textures-v75.cjs
          node tests/creature-sprites-v731.cjs
          node tests/controls.cjs
          node tests/controls-v57.cjs
          node tests/open-jumps.cjs
          node tests/splash-jump.cjs
          node tests/splash-controls.cjs
          node tests/mobile-polish.cjs
          node tests/highland.cjs
          node tests/tutorial.cjs
          node tests/family-expansion.cjs
          node tests/rana-combat.cjs
          node tests/polish-v52.cjs
          node tests/world-richness-v53.cjs
          node tests/royal-tutorial-v54.cjs
          node tests/spark-eel-v55.cjs
          node tests/arena-access-v56.cjs
          node tests/music-v56.cjs
          node tests/shark-v58.cjs
          node tests/shark-polish-v59.cjs
          node tests/music.cjs
          node tests/export-standalone.cjs
          node tests/tutorial-v6.cjs
          node tests/clarity-predator-v61.cjs
          node tests/graphics-scoring-v62.cjs
          node tests/length-v63.cjs
          node tests/jump-enemy-v64.cjs
          node tests/restoration-enemy-v65.cjs
          node tests/shadow-crab-v70.cjs
          node tests/shadow-crab-runtime-v70.cjs
          node tests/polish-v70.cjs
          node tests/adventure-select-v71.cjs
          node tests/icon-spectacular-v72.cjs

      - name: Export standalone 8.0 HTML
        run: python3 scripts/export-standalone.py Mermaid-Adventure-8.0.html
      - name: Upload standalone 8.0 HTML
        uses: actions/upload-artifact@v4
        with:
          name: Mermaid-Adventure-8.0
          path: Mermaid-Adventure-8.0.html
          if-no-files-found: error
