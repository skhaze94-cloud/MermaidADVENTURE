name: Godot Level 1 smoke test

on:
  push:
    branches:
      - godot/highland-gold-level-1-prototype
    paths:
      - "project.godot"
      - "godot/**"
      - "dist/assets/**"
      - "dist/fonts/**"
      - ".github/workflows/godot-level1.yml"
  pull_request:
    paths:
      - "project.godot"
      - "godot/**"
      - "dist/assets/**"
      - "dist/fonts/**"
      - ".github/workflows/godot-level1.yml"

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Verify Godot
        run: godot --version
      - name: Import existing artwork and compile Godot scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|^ERROR:' /tmp/godot-import.log; then
            echo "Godot editor emitted errors"
            exit 1
          fi
      - name: Exercise waterfall, pickups, checkpoints and exit portal
        shell: bash
        run: |
          set -o pipefail
          timeout -k 3s 45s godot --headless --path . --quit-after 240 --script res://godot/level1_smoke_test.gd 2>&1 | tee /tmp/godot-logic.log
          grep -q 'GODOT LEVEL 1 LOGIC TEST PASSED' /tmp/godot-logic.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|^ERROR:' /tmp/godot-logic.log; then
            echo "Godot gameplay smoke test emitted errors"
            exit 1
          fi
      - name: Exercise gameplay, controls, combat and checkpoint rollback
        shell: bash
        run: |
          set -o pipefail
          timeout -k 3s 45s godot --headless --path . --script res://godot/gameplay_controls_test.gd 2>&1 | tee /tmp/godot-gameplay.log
          grep -q 'GODOT GAMEPLAY CONTROLS TEST PASSED' /tmp/godot-gameplay.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|^ERROR:' /tmp/godot-gameplay.log; then
            exit 1
          fi
      - name: Exercise simulated device sizes, safe areas and multitouch
        shell: bash
        run: |
          set -o pipefail
          timeout -k 3s 45s godot --headless --path . --script res://godot/device_layout_test.gd 2>&1 | tee /tmp/godot-device.log
          grep -q 'GODOT DEVICE LAYOUT TEST PASSED' /tmp/godot-device.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|^ERROR:' /tmp/godot-device.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: godot-v07-device-layout-report
          path: godot/device-qa/*.json
      - name: Exercise opening, menu navigation and scene transitions
        shell: bash
        run: |
          set -o pipefail
          timeout -k 3s 45s godot --headless --path . --script res://godot/title_flow_test.gd 2>&1 | tee /tmp/godot-title.log
          grep -q 'GODOT TITLE FLOW TEST PASSED' /tmp/godot-title.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|^ERROR:' /tmp/godot-title.log; then
            exit 1
          fi
      - name: Verify all enemy portraits and combat pose transitions
        shell: bash
        run: |
          set -o pipefail
          timeout -k 3s 45s godot --headless --path . --script res://godot/enemy_visuals_test.gd 2>&1 | tee /tmp/godot-enemies.log
          grep -q 'GODOT ENEMY VISUALS TEST PASSED' /tmp/godot-enemies.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|^ERROR:' /tmp/godot-enemies.log; then
            exit 1
          fi
      - name: Launch the storybook opening headless
        shell: bash
        run: |
          set -o pipefail
          godot --headless --verbose --path . --quit-after 16 2>&1 | tee /tmp/godot-startup.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|^ERROR:' /tmp/godot-startup.log; then
            echo "Godot runtime emitted errors"
            exit 1
          fi
