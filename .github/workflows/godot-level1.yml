name: Godot Level 1 smoke test

on:
  push:
    branches:
      - godot/highland-gold-level-1-prototype
    paths:
      - "project.godot"
      - "godot/**"
      - "dist/assets/*.import"
      - ".github/workflows/godot-level1.yml"
  pull_request:
    paths:
      - "project.godot"
      - "godot/**"
      - "dist/assets/*.import"
      - ".github/workflows/godot-level1.yml"

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Verify Godot
        run: godot --version
      - name: Import existing artwork and compile Godot scripts
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|^ERROR:' /tmp/godot-import.log; then
            echo "Godot editor emitted errors"
            exit 1
          fi
      - name: Exercise waterfall, pickups, checkpoints and exit portal
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://godot/level1_smoke_test.gd 2>&1 | tee /tmp/godot-logic.log
          grep -q 'GODOT LEVEL 1 LOGIC TEST PASSED' /tmp/godot-logic.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|^ERROR:' /tmp/godot-logic.log; then
            echo "Godot gameplay smoke test emitted errors"
            exit 1
          fi
      - name: Launch first level headless
        shell: bash
        run: |
          set -o pipefail
          godot --headless --verbose --path . --quit-after 16 2>&1 | tee /tmp/godot-startup.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|^ERROR:' /tmp/godot-startup.log; then
            echo "Godot runtime emitted errors"
            exit 1
          fi
